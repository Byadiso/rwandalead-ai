version: "3.9"

services:

  db:
    image: postgres:16

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rwandalead

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend

    depends_on:
      - db

    ports:
      - "8000:8000"

    env_file:
      - backend/.env

  frontend:
    build: ./frontend

    ports:
      - "5173:5173"

volumes:
  postgres_data: